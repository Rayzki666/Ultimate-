services:
  - type: web
    name: frame-grok-gateway
    runtime: node
    plan: free
    buildCommand: node --version
    startCommand: node server/server.mjs
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: xai
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.3
      - key: XAI_IMAGE_DETAIL
        value: low
      - key: XAI_REASONING_EFFORT
        value: none
      - key: APP_TOKEN
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://rayzki666.github.io
