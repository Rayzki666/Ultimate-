name: Camera checks
on:
  push:
    branches: ['claude/ai-photo-assistant-4cxjbo']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guidance and geometry regressions
        run: node --test tests/guidance.test.mjs
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/camera-test" --no-save playwright@1.56.1
          node "$RUNNER_TEMP/camera-test/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Camera browser smoke
        env:
          NODE_PATH: ${{ runner.temp }}/camera-test/node_modules
        run: node tests/browser-smoke.cjs
      - name: Keep phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-screens
          path: test-results/*.png
          if-no-files-found: ignore
